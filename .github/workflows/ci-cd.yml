name: WBand CI/CD

on:
  pull_request:
  push:
    branches:
      - staging
      - release

permissions:
  contents: read

concurrency:
  group: wband-ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUN_VERSION: 1.3.14

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      webapi: ${{ steps.affected.outputs.webapi }}
      worker: ${{ steps.affected.outputs.worker }}
      web: ${{ steps.affected.outputs.web }}
      backend: ${{ steps.affected.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect changed dependency graphs
        id: affected
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-affected.sh "$BASE_SHA" "$HEAD_SHA"

  backend-tests:
    name: Backend / tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore tests
        run: dotnet restore Tests/WBand.Architecture.Tests/WBand.Architecture.Tests.csproj
      - name: Run backend tests
        run: dotnet test Tests/WBand.Architecture.Tests/WBand.Architecture.Tests.csproj --configuration Release --no-restore --verbosity normal

  webapi:
    name: WBand.WebAPI / build
    needs: changes
    if: needs.changes.outputs.webapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore App/WBand.WebAPI/WBand.WebAPI.csproj
      - name: Build
        run: dotnet build App/WBand.WebAPI/WBand.WebAPI.csproj --configuration Release --no-restore
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Validate Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: App/WBand.WebAPI/Dockerfile
          push: false
          tags: wband-webapi:pr-check
          cache-from: type=gha,scope=webapi

  worker:
    name: WBand.MixerWorker / build
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore App/WBand.MixerWorker/WBand.MixerWorker.csproj
      - name: Build
        run: dotnet build App/WBand.MixerWorker/WBand.MixerWorker.csproj --configuration Release --no-restore
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Validate Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: App/WBand.MixerWorker/Dockerfile
          push: false
          tags: wband-mixer_worker:pr-check
          cache-from: type=gha,scope=mixer_worker

  web:
    name: web / lint, test and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Validate Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: App/web/Dockerfile
          push: false
          tags: wband-web:pr-check
          cache-from: type=gha,scope=web

  ci-result:
    name: Affected projects / result
    if: always()
    needs:
      - changes
      - backend-tests
      - webapi
      - worker
      - web
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          WEBAPI_RESULT: ${{ needs.webapi.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGES_RESULT" "$BACKEND_RESULT" "$WEBAPI_RESULT" "$WORKER_RESULT" "$WEB_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required job finished with status: $result" >&2
              exit 1
            fi
          done

  publish-webapi:
    name: Publish WBand.WebAPI image
    if: github.event_name == 'push' && needs.changes.outputs.webapi == 'true'
    needs: [changes, backend-tests, webapi, ci-result]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: App/WBand.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_USERNAME }}/wband-webapi:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY_USERNAME }}/wband-webapi:${{ github.ref_name }}
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi

  publish-worker:
    name: Publish WBand.MixerWorker image
    if: github.event_name == 'push' && needs.changes.outputs.worker == 'true'
    needs: [changes, backend-tests, worker, ci-result]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: App/WBand.MixerWorker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_USERNAME }}/wband-mixer_worker:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY_USERNAME }}/wband-mixer_worker:${{ github.ref_name }}
          cache-from: type=gha,scope=mixer_worker
          cache-to: type=gha,mode=max,scope=mixer_worker

  publish-web:
    name: Publish web image
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    needs: [changes, web, ci-result]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: App/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_USERNAME }}/wband-web:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY_USERNAME }}/wband-web:${{ github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy changed services to Swarm
    if: >-
      always() && github.event_name == 'push' &&
      (needs.changes.outputs.webapi == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.web == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - changes
      - publish-webapi
      - publish-worker
      - publish-web
    runs-on: [self-hosted, linux, docker, swarm-manager]
    environment:
      name: ${{ github.ref_name == 'release' && 'production' || 'staging' }}
    env:
      DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
      WEBAPI_CHANGED: ${{ needs.changes.outputs.webapi }}
      WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
      WEB_CHANGED: ${{ needs.changes.outputs.web }}
      WEBAPI_SERVICE: ${{ vars.SWARM_WEBAPI_SERVICE }}
      WORKER_SERVICE: ${{ vars.SWARM_MIXER_WORKER_SERVICE }}
      WEB_SERVICE: ${{ vars.SWARM_WEB_SERVICE }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKER_REGISTRY_URL"
          test -n "$REGISTRY_NAMESPACE"
          [[ "$WEBAPI_CHANGED" != "true" ]] || test -n "$WEBAPI_SERVICE"
          [[ "$WORKER_CHANGED" != "true" ]] || test -n "$WORKER_SERVICE"
          [[ "$WEB_CHANGED" != "true" ]] || test -n "$WEB_SERVICE"

      - name: Login to container registry
        shell: bash
        env:
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY_URL" --username "$DOCKER_REGISTRY_USERNAME" --password-stdin

      - name: Update changed Swarm services
        shell: bash
        run: |
          set -euo pipefail

          deploy_service() {
            local service="$1"
            local image="$2"
            echo "Updating ${service} to ${image}"
            docker service inspect "$service" >/dev/null
            docker service update \
              --with-registry-auth \
              --detach=false \
              --update-failure-action rollback \
              --update-monitor 30s \
              --image "$image" \
              "$service"
          }

          if [[ "$WEBAPI_CHANGED" == "true" ]]; then
            deploy_service "$WEBAPI_SERVICE" "$DOCKER_REGISTRY_URL/$REGISTRY_NAMESPACE/wband-webapi:${GITHUB_SHA}"
          fi
          if [[ "$WORKER_CHANGED" == "true" ]]; then
            deploy_service "$WORKER_SERVICE" "$DOCKER_REGISTRY_URL/$REGISTRY_NAMESPACE/wband-mixer_worker:${GITHUB_SHA}"
          fi
          if [[ "$WEB_CHANGED" == "true" ]]; then
            deploy_service "$WEB_SERVICE" "$DOCKER_REGISTRY_URL/$REGISTRY_NAMESPACE/wband-web:${GITHUB_SHA}"
          fi

      - name: Logout from container registry
        if: always()
        shell: bash
        run: docker logout "$DOCKER_REGISTRY_URL" || true
