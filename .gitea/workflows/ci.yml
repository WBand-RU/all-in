name: CI
on:
  push:
    branches: [main, master]

env:
  DOCKER_TLS_CERTDIR: ""

jobs:
  # ===== BUILD =====
  build-apigateway:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: apigateway
      service_path: backend/src/ApiGateway
      service_context: backend
    secrets: inherit

  build-bandservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: bandservice
      service_path: backend/src/BandService
      service_context: backend
    secrets: inherit

  build-playbackservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: playbackservice
      service_path: backend/src/PlaybackService
      service_context: backend
    secrets: inherit

  build-playlistservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: playlistservice
      service_path: backend/src/PlaylistService
      service_context: backend
    secrets: inherit

  build-sectioneditorservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: sectioneditorservice
      service_path: backend/src/SectionEditorService
      service_context: backend
    secrets: inherit

  build-songservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: songservice
      service_path: backend/src/SongService
      service_context: backend
    secrets: inherit

  build-transpositionservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: transpositionservice
      service_path: backend/src/TranspositionService
      service_context: backend
    secrets: inherit

  build-userservice:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: userservice
      service_path: backend/src/UserService
      service_context: backend
    secrets: inherit

  build-frontend:
    if: github.ref == 'refs/heads/main'
    uses: ./.gitea/workflows/reusable-docker-build.yml
    with:
      service_name: frontend
      service_path: frontend
      service_context: frontend
    secrets: inherit

  # ===== DEPLOY (на main) =====
  deploy-swarm:
    if: github.ref == 'refs/heads/main'
    needs:
      - build-apigateway
      - build-bandservice
      - build-playbackservice
      - build-playlistservice
      - build-sectioneditorservice
      - build-songservice
      - build-transpositionservice
      - build-userservice
      - build-frontend
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно для git diff

      - name: Set IMAGE_TAG and IMAGE_PREFIX
        env:
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "IMAGE_PREFIX=${DOCKER_REGISTRY_URL}/wband" >> $GITHUB_ENV

      - name: Docker login
        env:
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USERNAME" --password-stdin "$DOCKER_REGISTRY_URL"

      - name: Update only changed services
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail

          # Определяем базовый коммит для сравнения (предыдущий на ветке)
          BASE=$(git rev-parse HEAD~1 || echo "")
          if [ -z "$BASE" ]; then
          echo "No BASE found, will update ALL services"
          UPDATE_ALL=1
          else
          UPDATE_ALL=0
          fi

          # Список изменённых файлов
          if [ "$UPDATE_ALL" -eq 0 ]; then
          git diff --name-only "$BASE" HEAD > /tmp/changed_files.txt
          else
          : > /tmp/changed_files.txt
          fi

          # Карта сервисов и их путей (если затронут путь — обновляем сервис)
          declare -A MAP
          MAP[apigateway]="backend/src/ApiGateway backend/Dockerfile"
          MAP[bandservice]="backend/src/BandService backend/Dockerfile"
          MAP[playbackservice]="backend/src/PlaybackService backend/Dockerfile"
          MAP[playlistservice]="backend/src/PlaylistService backend/Dockerfile"
          MAP[sectioneditorservice]="backend/src/SectionEditorService backend/Dockerfile"
          MAP[songservice]="backend/src/SongService backend/Dockerfile"
          MAP[transpositionservice]="backend/src/TranspositionService backend/Dockerfile"
          MAP[userservice]="backend/src/UserService backend/Dockerfile"
          MAP[frontend]="frontend"

          changed_services=()

          for svc in "${!MAP[@]}"; do
          if [ "$UPDATE_ALL" -eq 1 ]; then
            changed_services+=("$svc")
            continue
          fi

          for p in ${MAP[$svc]}; do
            if grep -qE "^${p}(/|$)" /tmp/changed_files.txt; then
            changed_services+=("$svc")
            break
            fi
          done
          done

          if [ ${#changed_services[@]} -eq 0 ]; then
          echo "No services changed. Nothing to update."
          exit 0
          fi

          echo "Will update services: ${changed_services[*]}"

          for svc in "${changed_services[@]}"; do
          echo "Updating $svc -> ${IMAGE_PREFIX}/${svc}:${IMAGE_TAG}"
          docker service update --image "${IMAGE_PREFIX}/${svc}:${IMAGE_TAG}" "${svc}"
          done
