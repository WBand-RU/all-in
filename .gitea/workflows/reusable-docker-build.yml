name: Reusable Docker Build
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      service_context:
        required: true
        type: string

jobs:
  build:
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set IMAGE_TAG (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Docker login
        env:
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USERNAME" --password-stdin "$DOCKER_REGISTRY_URL"

      - name: Build image
        env:
          IMAGE_PREFIX: ${{ secrets.DOCKER_REGISTRY_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SERVICE_NAME: ${{ inputs.service_name }}
          SERVICE_PATH: ${{ inputs.service_path }}
          SERVICE_CONTEXT: ${{ inputs.service_context }}
        run: |
          echo "Building $SERVICE_NAME..."
          docker build \
            --pull \
            -t "$IMAGE_PREFIX/$SERVICE_NAME:$IMAGE_TAG" \
            -f "$SERVICE_PATH/Dockerfile" \
            "$SERVICE_CONTEXT"

      - name: Push image
        env:
          IMAGE_PREFIX: ${{ secrets.DOCKER_REGISTRY_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          docker push "$IMAGE_PREFIX/$SERVICE_NAME:$IMAGE_TAG"
